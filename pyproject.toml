[project]
name = "solrcmf"
description = "Tools for integrative analysis in flexible matrix layouts using penalized optimization techniques"
dynamic = ["version"]
authors = [{ name = "Felix Held", email = "felix.held@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23",
    "joblib>=1.3.2",
    "scikit-learn>=1.1.0",
    "typing-extensions>=4.9.0; python_version < '3.11'",
]

[project.urls]
"Documentation" = "https://cyianor.github.io/solrcmf"
"Source" = "https://github.com/cyianor/solrcmf"
"Bug Tracker" = "https://github.com/cyianor/solrcmf/issues"

[tool.hatch.version]
path = "src/solrcmf/__about__.py"

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-material",
    "mkdocs-jupyter",
]

[tool.hatch.envs.dev]
features = [
    "docs",
]
dependencies = [
    "ipykernel",
    "nbconvert",
    "pandas",
    "ruff",
    "build",
    "twine",
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.12.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive --ignore-missing-imports --check-untyped-defs src/solrcmf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "README.ipynb",
]

[tool.ruff]
line-length = 79
